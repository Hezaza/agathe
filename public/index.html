<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGATHE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/config.js"></script>
<script src="/claude-shim.js"></script>
<style>
:root{--ac:#0a76b5;--navy:#0b2a5b;--green:#6cb500;--ok:#4d8f00;--bg:color-mix(in srgb,var(--ac) 5%,#fff);--card:#fff;--tx:color-mix(in srgb,var(--navy) 85%,#000);--mu:#5b6b82;--bd:color-mix(in srgb,var(--ac) 22%,#fff);--ac2:color-mix(in srgb,var(--ac) 13%,#fff);--ac3:color-mix(in srgb,var(--ac) 45%,#fff);--acd:color-mix(in srgb,var(--ac) 70%,var(--navy));--wa:#b45309;--er:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;margin:0 12px 0 0}h2{font-size:15px;margin:18px 0 8px}
nav{display:flex;gap:4px;flex-wrap:wrap}.sp{flex:1}
button,.btn,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button,.btn{cursor:pointer}button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:14px 16px;max-width:1300px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.k b{display:block;font-size:24px}.k span{color:var(--mu);font-size:12px}
.c2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.cd{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.br{position:relative;display:flex;justify-content:space-between;gap:8px;padding:3px 6px;margin:3px 0;font-size:13px;border-radius:4px;overflow:hidden}
.br i{position:absolute;left:0;top:0;bottom:0;background:var(--ac2);z-index:0}.br span,.br b{position:relative;z-index:1}
.w{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
th{background:var(--bg);font-size:12px;color:var(--mu)}tr.r{cursor:pointer}tr.r:hover{background:var(--ac2)}
.tg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--ac2)}.a3{color:var(--er)}.a2{color:var(--wa)}.a1{color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input{min-width:200px;flex:1}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:20}
#md .bx{background:var(--bg);border-radius:10px;max-width:900px;width:100%;padding:16px}
.stp{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.stp button.d{background:var(--ok);color:#fff;border-color:var(--ok)}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.fl label{font-size:11px;color:var(--mu);display:block}.fl input,.fl select,.fl textarea{width:100%}
#st{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 14px;border-radius:16px;display:none;z-index:30}
.em{text-align:center;padding:50px 10px;color:var(--mu)}#lo{height:34px;max-width:140px;object-fit:contain}#lg{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;align-items:center;justify-content:center}#lg .bx{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:28px;width:340px;max-width:92vw;text-align:center}#lg img{max-height:90px;max-width:220px;margin-bottom:10px}#lg input{width:100%;margin:10px 0}

/* ===== Thème lumineux (couleurs pilotées par le logo) ===== */
html{background:var(--bg)}body{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 10%,#fff) 0,color-mix(in srgb,var(--ac) 3%,#fff) 260px,var(--bg) 100%) fixed}
header{background:#fff;border-bottom:3px solid var(--green);box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 14%,transparent)}
h1{color:var(--navy)}h2{color:var(--navy);padding-left:9px;border-left:4px solid var(--green)}
nav button{background:#fff;border-color:var(--ac3);color:var(--navy);font-weight:600}nav button:hover{background:var(--ac2)}
button.on,.btn.p{background:linear-gradient(135deg,var(--ac),var(--acd));border-color:var(--acd);color:#fff}
.btn.p:hover,button.on:hover{filter:brightness(1.08)}
button:hover:not(.on):not(.p){background:var(--ac2)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac3);border-color:var(--ac)}
.k{border-left:5px solid var(--green);box-shadow:0 1px 6px color-mix(in srgb,var(--ac) 10%,transparent)}.k b{color:var(--navy)}
.cd{border-top:3px solid var(--ac);box-shadow:0 1px 6px color-mix(in srgb,var(--ac) 10%,transparent)}
.w{box-shadow:0 1px 6px color-mix(in srgb,var(--ac) 10%,transparent);border-color:var(--ac3)}
th{background:var(--ac2);color:var(--navy);border-bottom:2px solid var(--ac3)}tr.r:hover{background:var(--ac2)}
.tg{background:var(--ac2);color:var(--navy);font-weight:600}
.br i{background:linear-gradient(90deg,var(--ac3),color-mix(in srgb,var(--green) 35%,#fff))}
#md{background:color-mix(in srgb,var(--navy) 55%,transparent)}#md .bx{background:var(--bg);border-top:4px solid var(--green)}
.stp button.d{background:var(--ok);border-color:var(--ok)}
#lg{background:linear-gradient(160deg,var(--ac2),#fff 55%,color-mix(in srgb,var(--green) 18%,#fff))}#lg .bx{border-top:4px solid var(--green);box-shadow:0 8px 30px color-mix(in srgb,var(--ac) 18%,transparent)}
#st{background:var(--navy);color:#fff}
@media print{body{background:#fff!important}}
</style></head><body>
<header><img id="lo" alt="" hidden><h1 id="tt">AGATHE</h1>
<nav id="nv"></nav><span class="sp"></span>
<span id="us" class="a1"></span><button onclick="cfg()" title="Entreprise">⚙</button><button class="btn p" onclick="nw()">➕ Nouveau dossier</button><label class="btn">⬆ Importer Excel<input id="fi" type="file" accept=".xlsx,.xls" hidden></label>
<button id="ex">⬇ Exporter Excel</button><button onclick="lo_()">⎋ Déconnexion</button></header>
<main id="m"></main><div id="lg"></div><div id="md"></div><div id="st"></div>
<script>
const FS="Statut du Dossier",FC="Nom Client",AP="Date d'arrivée prévue",AR="Date d'arrivée réelle",LV="Date Livraison",FT="Date Transfert en facture";
const TABS=[['dash','Tableau de bord'],['list','Dossiers'],['alr','Alertes'],['rec','Récap client']];
const STEPS=[['Pré-alerte','Date pre alerte'],['Arrivée',AR],['Vérification','Date Vérification'],['Déclaration','Date Déclaration validée'],['BAE','Date Signature BAE'],['Livraison',LV],['Facturation',FT]];
const SEC=[['Transport',['Nom Fournisseur','N° Commande Client','Lieu Origine','Lieu Destination','Nature marchandises','Nbre de colis','Poids','Volume','Nom Navire','N° voyage/vol','N° BL/LTA','Type Conteneur','Containers','Date départ prévu','Date départ réelle',AP,AR,'Date pre alerte']],
['Régime et OT',['Régime','N° OT','Date d\'ouverture','Date AMM ou Dispense','Date de dépôt DREP en Douane','N° Decision','Date obtention du N° decision']],
['Déclaration',['Date Vérification','Vérificateur','Date de saisie declaration provisoire','Saisissant','Contrôleur','Date dépôt Déclaration Douane','Date Déclaration validée','N° Déclaration','Inspecteur','Visite (O/N)','Date Signature BAE','Numéro de liquidation','Montant RUSID','Montant Droit Douane']],
['Livraison et facturation',['Nom Acconier','Date manifeste','Date Mise en Livraison',LV,'Livré Par',FT,'Facture n°']]];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=(r,k)=>String(r[k]??'').trim(),cl=r=>g(r,FC).replace(/\s+/g,' ').toUpperCase();
const today=new Date().toISOString().slice(0,10),ok=v=>/^20(2[4-9]|3\d)-\d\d-\d\d$/.test(v),dd=(a,b=today)=>Math.round((new Date(b)-new Date(a))/864e5);
const act=r=>!/CLOTURE|ANNULE/.test(g(r,FS)),num=v=>parseInt(String(v??'').replace(/[^\d]/g,''))||0,fm=n=>n.toLocaleString('fr-FR');
const fd=v=>ok(v)?v.split('-').reverse().join('/'):esc(v);
let db,dls,chunks={},rows=[],view='dash',q='',fst='',fcl='',rc='',r1='',r2='',pend={},tm,me='',ident='',ident0='',brand={};
function st(t,ms=2500){const e=$('#st');e.textContent=t;e.style.display='block';clearTimeout(tm);if(ms)tm=setTimeout(()=>e.style.display='none',ms)}
function build(){rows=[];Object.keys(chunks).sort().forEach(id=>chunks[id].forEach((r,i)=>{r._c=id;r._i=i;rows.push(r)}))}
const cnt=(a,f)=>{const o={};a.forEach(r=>{const k=f(r)||'—';o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const bars=(e,n=10)=>{const m=e[0]?.[1]||1;return e.slice(0,n).map(([k,v])=>`<div class="br"><span>${esc(k)}</span><i style="width:${v/m*100}%"></i><b>${v}</b></div>`).join('')};
function alerts(){const A=[];rows.filter(act).forEach(r=>{const s=g(r,FS),ap=g(r,AP),ar=g(r,AR),lv=g(r,LV),ft=g(r,FT);
if(/PROROGATION/.test(s))A.push([r,'Prorogation à demander avant échéance',3]);
if(!ar&&ok(ap)&&ap<today)A.push([r,`Arrivée prévue dépassée de ${dd(ap)} j`,2]);
if(ok(ar)&&!lv&&dd(ar)>=8)A.push([r,dd(ar)>11?`Arrivé depuis ${dd(ar)} j, non livré (limite de 11 j dépassée)`:`Arrivé depuis ${dd(ar)} j : à livrer avant le 11e jour`,dd(ar)>11?3:2]);
if(ok(lv)&&!ft&&dd(lv)>7)A.push([r,`Livré depuis ${dd(lv)} j, à facturer`,1])});return A.sort((a,b)=>b[2]-a[2])}
function rowTr(r){return`<tr class="r" onclick="op('${r._c}|${r._i}')"><td>${esc(g(r,'N° dossier'))}</td><td>${esc(g(r,FC))}</td><td>${esc(g(r,'N° BL/LTA'))}</td><td>${esc(g(r,'Nom Navire'))}</td><td>${esc(g(r,'Nature marchandises'))}</td><td>${fd(g(r,AR)||g(r,AP))}</td><td>${fd(g(r,LV))}</td><td><span class="tg">${esc(g(r,FS))}</span></td></tr>`}
const TH='<tr><th>N° dossier<th>Client<th>BL / LTA<th>Navire<th>Marchandises<th>Arrivée<th>Livraison<th>Statut</tr>';
function render(){$('#nv').innerHTML=TABS.map(([k,l])=>`<button class="${view==k?'on':''}" onclick="view='${k}';render()">${l}${k=='alr'&&rows.length?' ('+alerts().length+')':''}</button>`).join('');
const m=$('#m');if(!db){m.innerHTML='<div class="em">Base de données partagée indisponible. Ouvrez la page connecté à claude.ai.</div>';return}
if(!rows.length){m.innerHTML='<div class="em"><h2>Aucun dossier</h2>Cliquez sur « Importer Excel » et choisissez votre tableau de suivi. Il sera partagé avec toute l\'équipe.</div>';return}
if(view=='dash'){const a=rows.filter(act);m.innerHTML=`<div class="g"><div class="k"><b>${rows.length}</b><span>Dossiers</span></div><div class="k"><b>${a.length}</b><span>En cours</span></div><div class="k"><b>${rows.length-a.length}</b><span>Clôturés / annulés</span></div><div class="k"><b>${alerts().length}</b><span>Alertes</span></div></div>
<div class="c2"><div><h2>Dossiers en cours par statut</h2><div class="cd">${bars(cnt(a,r=>g(r,FS)))}</div></div><div><h2>Dossiers par client</h2><div class="cd">${bars(cnt(rows,cl),8)}</div></div><div><h2>Par régime</h2><div class="cd">${bars(cnt(rows,r=>g(r,'Régime')))}</div></div><div><h2>Par acconier</h2><div class="cd">${bars(cnt(rows,r=>g(r,'Nom Acconier')),8)}</div></div></div>`}
else if(view=='list'){const sts=[...new Set(rows.map(r=>g(r,FS)))].sort(),cls=[...new Set(rows.map(cl))].sort();
m.innerHTML=`<div class="bar"><input id="q" placeholder="Rechercher (n° dossier, BL, conteneur, navire…)" value="${esc(q)}" oninput="q=this.value;fl()"><select onchange="fst=this.value;fl()"><option value="">Tous les statuts</option>${sts.map(s=>`<option ${s==fst?'selected':''}>${esc(s)}</option>`).join('')}</select><select onchange="fcl=this.value;fl()"><option value="">Tous les clients</option>${cls.map(s=>`<option ${s==fcl?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div id="lst"></div>`;fl()}
else if(view=='alr'){const A=alerts();m.innerHTML=`<h2>${A.length} alerte(s)</h2><div class="w"><table><tr><th>Alerte<th>N° dossier<th>Client<th>Navire<th>Statut</tr>${A.map(([r,t,s])=>`<tr class="r" onclick="op('${r._c}|${r._i}')"><td class="a${s}">${esc(t)}<td>${esc(g(r,'N° dossier'))}<td>${esc(g(r,FC))}<td>${esc(g(r,'Nom Navire'))}<td>${esc(g(r,FS))}</tr>`).join('')}</table></div>`}
else{const cls=[...new Set(rows.map(cl))].sort();let L=[];if(rc)L=rows.filter(r=>cl(r)==rc&&(!r1||(g(r,AR)||g(r,AP))>=r1)&&(!r2||(g(r,AR)||g(r,AP))<=r2));
m.innerHTML=`<div class="bar"><select onchange="rc=this.value;render()"><option value="">Choisir un client…</option>${cls.map(s=>`<option ${s==rc?'selected':''}>${esc(s)}</option>`).join('')}</select>Du <input type="date" value="${r1}" onchange="r1=this.value;render()"> au <input type="date" value="${r2}" onchange="r2=this.value;render()">${rc?'<button class="p btn" onclick="exRec()">⬇ Exporter le récap</button>':''}</div>`+(rc?`<div class="g"><div class="k"><b>${L.length}</b><span>Dossiers</span></div><div class="k"><b>${L.filter(act).length}</b><span>En cours</span></div><div class="k"><b>${fm(L.reduce((s,r)=>s+num(g(r,'Nbre de colis')),0))}</b><span>Colis</span></div><div class="k"><b>${fm(L.reduce((s,r)=>s+num(r['Montant Droit Douane']),0))}</b><span>Droits de douane (XAF)</span></div><div class="k"><b>${fm(L.reduce((s,r)=>s+num(r['Montant RUSID']),0))}</b><span>RUSID (XAF)</span></div></div><h2>Détail</h2><div class="w"><table>${TH}${L.map(rowTr).join('')}</table></div>`:'<div class="em">Sélectionnez un client pour générer son récapitulatif.</div>')}}
function fl(){const s=q.toLowerCase();const L=rows.filter(r=>(!fst||g(r,FS)==fst)&&(!fcl||cl(r)==fcl)&&(!s||['N° dossier','N° BL/LTA','Containers','Nom Navire',FC,'N° Déclaration'].some(k=>g(r,k).toLowerCase().includes(s))));
$('#lst').innerHTML=`<div class="w"><table>${TH}${L.slice().reverse().slice(0,300).map(rowTr).join('')}</table></div><p class="a1">${L.length} dossier(s)${L.length>300?' — 300 premiers affichés, affinez la recherche':''}</p>`}
function op(id){const[c,i]=id.split('|'),r=chunks[c]?.[i];if(!r)return;const sts=[...new Set(rows.map(x=>g(x,FS)).concat(g(r,FS)))].filter(Boolean).sort();
const fld=k=>{const v=g(r,k),d=k.startsWith('Date');return`<div><label>${esc(k=='Lieu Origine'?'Provenance du dossier *':k)}</label><input ${d?'type="date" value="'+(ok(v)?v:'')+'"':'value="'+esc(v)+'"'} onchange="sv('${id}',this.dataset.k,this.value)" data-k="${esc(k)}"></div>`};
$('#md').innerHTML=`<div class="bx"><div style="display:flex;gap:10px;align-items:center"><h2 style="margin:0;flex:1">${esc(g(r,'N° dossier'))} — ${esc(g(r,FC))}</h2><button onclick="cm()">✕</button></div>
<div class="stp">${STEPS.map(([l,k])=>`<button class="${g(r,k)?'d':''}" onclick="stp('${id}',this.dataset.k)" data-k="${esc(k)}">${g(r,k)?'✓ ':''}${l}</button>`).join('')}</div>
<div class="fl"><div><label>${FS}</label><select onchange="sv('${id}','${FS}',this.value)">${sts.map(s=>`<option ${s==g(r,FS)?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div>
${SEC.map(([t,ks])=>`<h2>${t}</h2><div class="fl">${ks.map(fld).join('')}</div>`).join('')}
<p class="a1">Ouvert par : ${esc(g(r,'Ouvert par')||'—')} · Dernière modification : ${esc(g(r,'Modifié par')||'—')} ${fd(g(r,'Modifié le'))}</p><h2>Commentaires</h2><textarea rows="3" style="width:100%" onchange="sv('${id}','Commentaires Client',this.value)">${esc(g(r,'Commentaires Client'))}</textarea></div>`;$('#md').style.display='flex'}
function cm(){$('#md').style.display='none';render()}
function stp(id,k){const r=chunks[id.split('|')[0]][id.split('|')[1]];sv(id,k,g(r,k)?'':today);op(id)}
function sv(id,k,v){const[c,i]=id.split('|'),r=chunks[c][i];v=String(v).trim();if(v)r[k]=v;else delete r[k];r['Modifié par']=ident;r['Modifié le']=today;pend[c]=1;clearTimeout(sv.t);sv.t=setTimeout(async()=>{for(const c in pend){delete pend[c];try{await db.collection('chunks').doc(c).set({rows:chunks[c].map(({_c,_i,...x})=>x)});st('Enregistré')}catch(e){st('Échec : '+(e.message||e.code),5000)}}},500)}
async function dl(name,aoa){const ws=XLSX.utils.aoa_to_sheet(aoa),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Suivi');if(!dls)return st('Téléchargement indisponible');
try{await dls.save({filename:name+'.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})})}catch(e){if(e?.code=='declined')return;try{await dls.save({filename:name+'.csv',data:'\ufeff'+aoa.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n')})}catch(e2){st('Téléchargement impossible')}}}
function aoa(L){const ks=[];L.forEach(r=>Object.keys(r).forEach(k=>{if(k[0]!='_'&&!ks.includes(k))ks.push(k)}));return[ks,...L.map(r=>ks.map(k=>r[k]??''))]}
$('#ex').onclick=()=>rows.length?dl('suivi-dossiers-'+today,aoa(rows)):st('Rien à exporter');
function exRec(){dl('recap-'+rc.replace(/\W+/g,'-').toLowerCase()+'-'+today,aoa(rows.filter(r=>cl(r)==rc&&(!r1||(g(r,AR)||g(r,AP))>=r1)&&(!r2||(g(r,AR)||g(r,AP))<=r2))))}
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!db)return;try{st('Lecture du fichier…',0);
const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null}),out=[];
a.forEach(o=>{const r={};for(const k in o){let v=o[k];if(v==null)continue;if(v instanceof Date)v=new Date(v.getTime()+432e5).toISOString().slice(0,10);else if(typeof v=='string'){v=v.replace(/\s+/g,' ').trim();if(!v)continue}r[k.trim()]=v}
if(!r[FC])return;for(const k of['Urgence (O/N)','Visite (O/N)'])if(r[k])r[k]=/^(O|OUI)$/i.test(r[k])?'O':'N';out.push(r)});
const n=Math.ceil(out.length/40),ids=[];for(let i=0;i<n;i++){const id='c'+String(i).padStart(3,'0');ids.push(id);st(`Enregistrement ${i+1}/${n}…`,0);await db.collection('chunks').doc(id).set({rows:out.slice(i*40,i*40+40)})}
for(const id of Object.keys(chunks))if(!ids.includes(id))await db.collection('chunks').doc(id).delete();st(out.length+' dossiers importés',4000)}catch(err){st('Import impossible : '+(err.message||err.code||err),6000)}};
document.addEventListener('keydown',e=>{if(e.key=='Escape')cm()});
function paint(){const l=$('#lo');if(brand.logo){l.src=brand.logo;l.hidden=false}else l.hidden=true;$('#tt').textContent='AGATHE';document.title='AGATHE';gateUi()}
/* ===== Authentification : e-mail + mot de passe (Supabase Auth) ===== */
let lgMode='',dbR=null,ACC=null,ACCK='',OWNER_EMAIL='',AUTHED=false,failN=0,failT=0,SB=null;
const EM=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const pwOk=p=>String(p).length>=10&&/[A-Za-z]/.test(p)&&/\d/.test(p);
const PWMSG='Le mot de passe doit contenir au moins 10 caractères, avec des lettres et des chiffres';
function genPw(){const A='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ',N='23456789',S=A+N,r=crypto.getRandomValues(new Uint32Array(14));let p=A[r[0]%A.length]+N[r[1]%N.length];for(let i=2;i<14;i++)p+=S[r[i]%S.length];return p.split('').sort(()=>.5-(crypto.getRandomValues(new Uint8Array(1))[0]/255)).join('')}

{let _rp=null;setInterval(()=>{if(resp!==_rp){_rp=resp;rbTabs();if($('#md').style.display!='flex')render()}},500)}
const _r6=render;render=function(){_r6();try{if(AUTHED&&!TABS.length)$('#m').innerHTML='<div class="em">Aucune page ne vous est autoris\u00e9e pour le moment. Contactez le Super Administrateur.</div>';rbUi();if(view=='acc'&&db&&can('adm'))accView()}catch(e){console.error(e)}};
/* administration : cat\u00e9gories, droits de la cat\u00e9gorie C, journal */
/* administration : comptes, permissions, journal (Super Administrateur) */
let ACCS=[],unAcc=null;
function subAcc(){if(!db||!resp||unAcc)return;unAcc=db.collection('profiles').onSnapshot(s=>{ACCS=s.docs.map(d=>({k:d.id,...d.data()})).filter(u=>u.role!='owner');accUsers()},e=>st('Comptes indisponibles : '+(e.message||e.code),6000))}
function accView(){$('#m').innerHTML='<h2>Super Administrateur : comptes utilisateurs</h2><p class="a1">Vous êtes le seul à pouvoir créer, modifier, désactiver ou supprimer des comptes et définir leurs accès. Chaque utilisateur ne voit et n’utilise que ce que vous cochez pour lui. Il n’existe aucun autre rôle d’administrateur.</p><div class="bar"><button class="btn p" onclick="uForm()">➕ Créer un utilisateur</button><button onclick="saPw()">🔑 Changer mon mot de passe</button></div><div id="ac1"></div><h2>Sauvegarde et reprise des données</h2><div class="bar"><button onclick="bkExport()">⬇ Sauvegarde complète (.json)</button><label class="btn">⬆ Restaurer une sauvegarde<input type="file" accept=".json,application/json" hidden onchange="bkImport(this)"></label></div><p class="a1">La sauvegarde contient tous les dossiers, les clients et la fiche entreprise (logo compris). La restauration remplace les éléments de même référence. Les documents joints (PDF, Word, Excel) ne font pas partie de la sauvegarde.</p><h2>Maintenance : doublons de visites douanières</h2><div id="ac6"></div><h2>Journal des opérations sensibles</h2><div class="bar"><button onclick="jx()">⬇ Exporter le journal</button></div><div id="ac3"></div>';subAcc();accUsers();accLog();vdInit();subLog()}
function accUsers(){const el=$('#ac1');if(!el||!resp)return;const L=ACCS.slice().sort((a,b)=>String(a.nom||'').localeCompare(String(b.nom||'')));
el.innerHTML='<div class="w"><table><tr><th>Nom<th>E-mail<th>Fonction<th>Statut<th>Accès autorisés<th>Dernière connexion<th>Actions</tr>'+(L.map(u=>{const n=Object.keys(u.perms||{}).filter(k=>u.perms[k]===true&&PLAB[k]).length;return'<tr><td>'+esc(u.nom||'')+'<td>'+esc(u.email||'')+'<td>'+esc(u.fonction||'')+'<td>'+(u.actif===false?'<span class="tg" style="background:#fde2e2">Désactivé</span>':'<span class="tg" style="background:#e3f4e6">Actif</span>')+'<td>'+n+' / '+PALL.length+'<td style="white-space:nowrap">'+esc(String(u.last_login||'').replace('T',' ').slice(0,16)||'jamais')+'<td style="white-space:normal;max-width:none;overflow:visible"><button onclick="uForm(\''+u.k+'\')">✏ Modifier / accès</button> <button onclick="uPw(\''+u.k+'\')">🔑 Mot de passe</button> <button onclick="uTog(\''+u.k+'\')">'+(u.actif===false?'✔ Activer':'⏸ Désactiver')+'</button> <button onclick="uDel(this,\''+u.k+'\')">🗑 Supprimer</button></tr>'}).join('')||'<tr><td colspan=7 class="em">Aucun utilisateur. Cliquez sur « Créer un utilisateur ».</tr>')+'</table></div>'}
function uGuard(){if(!resp){st('Accès refusé : réservé au Super Administrateur',5000);aud('accès refusé',{fn:'gestion des comptes'});return false}return true}
function uForm(k){if(!uGuard())return;const u=k?ACCS.find(x=>x.k==k):null;if(k&&!u)return;const P=(u&&u.perms)||{};
$('#md').innerHTML='<div class="bx" style="max-width:760px"><div style="display:flex"><h2 style="margin:0;flex:1">'+(u?'Modifier l’utilisateur':'Créer un utilisateur')+'</h2><button onclick="cm()">✕</button></div><div class="fl" style="margin-top:10px"><div><label>Nom complet *</label><input id="u_nom" value="'+esc(u?u.nom||'':'')+'"></div><div><label>Adresse e-mail * (identifiant de connexion)</label><input id="u_em" type="email" '+(u?'disabled ':'')+'value="'+esc(u?u.email||'':'')+'"></div><div><label>Fonction</label><input id="u_fn" value="'+esc(u?u.fonction||'':'')+'"></div><div><label>Téléphone</label><input id="u_tel" value="'+esc(u?u.tel||'':'')+'"></div>'+(u?'':'<div><label>Mot de passe initial * (10 caractères minimum)</label><div style="display:flex;gap:6px"><input id="u_pw" style="flex:1" value="'+genPw()+'"><button type="button" onclick="$(\'#u_pw\').value=genPw()">🎲</button></div><p class="a1" style="margin:3px 0">À transmettre à l’utilisateur ; il ne sera plus affiché ensuite.</p></div>')+'</div><h2>Accès autorisés <span class="a1">(cochez ce qui est permis ; tout le reste est refusé)</span></h2><div class="bar"><button type="button" onclick="uAll(1)">Tout autoriser</button><button type="button" onclick="uAll(0)">Tout refuser</button></div>'+PGRP.map(g=>'<h3 style="margin:10px 0 4px;font-size:14px">'+esc(g[0])+'</h3>'+g[1].map(p=>'<label style="display:block;padding:2px 0"><input type="checkbox" class="up" data-p="'+p[0]+'" '+(P[p[0]]===true?'checked':'')+'> '+esc(p[1])+'</label>').join('')).join('')+'<div id="u_msg" class="a1" style="color:#c62828;min-height:18px;margin-top:8px"></div><p><button class="btn p" id="u_ok" onclick="uSave(\''+(k||'')+'\')">'+(u?'Enregistrer':'Créer le compte')+'</button> <button onclick="cm()">Annuler</button></p></div>';$('#md').style.display='flex'}
function uAll(on){document.querySelectorAll('#md .up').forEach(c=>c.checked=!!on)}
const uMsg=m=>{const e=$('#u_msg');if(e)e.textContent=m||''};
async function uSave(k){if(!uGuard())return;const nom=$('#u_nom').value.trim(),fn=$('#u_fn').value.trim(),tel=$('#u_tel').value.trim(),perms={};document.querySelectorAll('#md .up').forEach(c=>{if(c.checked)perms[c.dataset.p]=true});
if(!nom)return uMsg('Le nom est obligatoire');const b=$('#u_ok');
try{b.disabled=true;if(k){await apiU({action:'update',id:k,nom,fonction:fn,tel,perms});aud('compte utilisateur modifié',{compte:(ACCS.find(x=>x.k==k)||{}).email,acces:Object.keys(perms).join(',')});st('Compte enregistré');cm();return}
const em=$('#u_em').value.trim().toLowerCase(),pw=$('#u_pw').value;if(!EM.test(em)){b.disabled=false;return uMsg('Adresse e-mail invalide')}if(!pwOk(pw)){b.disabled=false;return uMsg(PWMSG)}
uMsg('Création…');await apiU({action:'create',email:em,nom,fonction:fn,tel,perms,password:pw});aud('compte utilisateur créé',{compte:em,acces:Object.keys(perms).join(',')});st('Compte créé : transmettez le mot de passe à '+nom,6000);cm()}
catch(e){if(b)b.disabled=false;uMsg('Échec : '+(e.message||e))}}
async function uTog(k){if(!uGuard())return;const u=ACCS.find(x=>x.k==k);if(!u)return;try{await apiU({action:'update',id:k,actif:u.actif===false});aud(u.actif===false?'compte activé':'compte désactivé',{compte:u.email});st(u.actif===false?'Compte activé':'Compte désactivé')}catch(e){st('Échec : '+(e.message||e),6000)}}
async function uDel(b,k){if(!uGuard())return;const u=ACCS.find(x=>x.k==k);if(!u)return;if(!b.dataset.a){b.dataset.a=1;b.textContent='⚠ Confirmer la suppression';setTimeout(()=>{if(b.isConnected){delete b.dataset.a;b.textContent='🗑 Supprimer'}},5000);return}
try{await apiU({action:'delete',id:k});aud('compte utilisateur supprimé',{compte:u.email});st('Compte supprimé')}catch(e){st('Échec : '+(e.message||e),6000)}}
function uPw(k){if(!uGuard())return;const u=ACCS.find(x=>x.k==k);if(!u)return;$('#md').innerHTML='<div class="bx" style="max-width:460px"><div style="display:flex"><h2 style="margin:0;flex:1">Nouveau mot de passe</h2><button onclick="cm()">✕</button></div><p class="a1">'+esc(u.nom||'')+' · '+esc(u.email||'')+'. L’utilisateur connecté sera déconnecté.</p><div style="display:flex;gap:6px"><input id="u_pw" style="flex:1" value="'+genPw()+'"><button type="button" onclick="$(\'#u_pw\').value=genPw()">🎲</button></div><div id="u_msg" class="a1" style="color:#c62828;min-height:18px"></div><p><button class="btn p" id="u_ok" onclick="uPwGo(\''+k+'\')">Enregistrer</button></p></div>';$('#md').style.display='flex'}
async function uPwGo(k){if(!uGuard())return;const pw=$('#u_pw').value;if(!pwOk(pw))return uMsg(PWMSG);const u=ACCS.find(x=>x.k==k);$('#u_ok').disabled=true;try{await apiU({action:'setpw',id:k,password:pw});aud('mot de passe réinitialisé',{compte:(u||{}).email});st('Mot de passe modifié : transmettez-le à l’utilisateur',6000);cm()}catch(e){$('#u_ok').disabled=false;uMsg('Échec : '+(e.message||e))}}
function saPw(){if(!uGuard())return;$('#md').innerHTML='<div class="bx" style="max-width:460px"><div style="display:flex"><h2 style="margin:0;flex:1">Mon mot de passe</h2><button onclick="cm()">✕</button></div><label class="a1">Mot de passe actuel<input id="s_old" type="password" style="width:100%"></label><label class="a1">Nouveau mot de passe<input id="s_new" type="password" style="width:100%"></label><div id="u_msg" class="a1" style="color:#c62828;min-height:18px"></div><p><button class="btn p" id="u_ok" onclick="saPwGo()">Enregistrer</button></p></div>';$('#md').style.display='flex'}
async function bkExport(){if(!resp)return;try{const out=[];const cs=await db.collection('chunks').get();cs.docs.forEach(d=>out.push({parent:'chunks',id:d.id,data:d.data()}));
for(const id of ['brand','clients','catalogue']){const x=await db.doc('config/'+id).get();if(x.exists)out.push({parent:'config',id,data:x.data()})}
await dls.save({filename:'agathe-sauvegarde-'+today+'.json',data:JSON.stringify({agathe:1,date:new Date().toISOString(),docs:out})});aud('sauvegarde exportée',{documents:out.length});st('Sauvegarde créée ('+out.length+' éléments)',5000)}catch(e){st('Échec : '+(e.message||e),6000)}}
async function bkImport(inp){if(!resp)return;const f=inp.files[0];inp.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(!j||j.agathe!==1||!Array.isArray(j.docs))throw new Error('fichier de sauvegarde invalide');
const L=j.docs.filter(d=>d&&(d.parent=='chunks'||(d.parent=='config'&&['brand','clients','catalogue'].includes(d.id)))&&/^[A-Za-z0-9_-]{1,60}$/.test(d.id)&&d.data&&typeof d.data=='object');if(!L.length)throw new Error('aucune donnée à restaurer');
if(!confirm('Restaurer '+L.length+' élément(s) ? Les dossiers, clients et paramètres de même référence seront remplacés.'))return;
let n=0;for(const d of L){st('Restauration '+(++n)+'/'+L.length+'…',0);await db.doc(d.parent+'/'+d.id).set(d.data)}aud('sauvegarde restaurée',{documents:n});st(n+' élément(s) restauré(s)',6000)}catch(e){st('Restauration impossible : '+(e.message||e),8000)}}
async function saPwGo(){if(!uGuard())return;const o=$('#s_old').value,n=$('#s_new').value;if(!pwOk(n))return uMsg(PWMSG);$('#u_ok').disabled=true;
try{const r=await SB.auth.signInWithPassword({email:OWNER_EMAIL,password:o});if(r.error){$('#u_ok').disabled=false;return uMsg('Mot de passe actuel incorrect')}
const u=await SB.auth.updateUser({password:n});if(u.error)throw u.error;aud('mot de passe Super Administrateur modifié',{});st('Mot de passe modifié');cm()}catch(e){$('#u_ok').disabled=false;uMsg('Échec : '+(e.message||e))}}
function subLog(){if(unsubA||!db)return;try{let q=db.collection('audit');try{q=q.orderBy('t','desc').limit(300)}catch(e){}unsubA=q.onSnapshot(s=>{ulog=s.docs.map(d=>d.data());ulog.sort((a,b)=>String(b.t||'').localeCompare(String(a.t||'')));accLog()},e=>st('Journal indisponible : '+(e.message||e.code),6000))}catch(e){}}
const logD=e=>{const{t,u,cat,a,uid,...r}=e;return Object.entries(r).map(([k,v])=>k+' : '+v).join(' \u00b7 ')};
function accLog(){const el=$('#ac3');if(!el)return;el.innerHTML='<div class="w"><table><tr><th>Date<th>Utilisateur<th>Cat.<th>Action<th>D\u00e9tail</tr>'+(ulog.slice(0,300).map(e=>'<tr><td style="white-space:nowrap">'+esc(String(e.t||'').replace('T',' ').slice(0,19))+'<td>'+esc(e.u)+'<td>'+esc(e.cat||'')+'<td>'+esc(e.a)+'<td style="white-space:normal;max-width:480px">'+esc(logD(e))+'</tr>').join('')||'<tr><td colspan=5 class="em">Aucune op\u00e9ration enregistr\u00e9e.</tr>')+'</table></div><p class="a1">'+ulog.length+' op\u00e9ration(s) (les 300 plus r\u00e9centes).</p>'}
function jx(){dl('journal-'+today,[['Date','Utilisateur','Cat\u00e9gorie','Action','D\u00e9tail'],...ulog.map(e=>[e.t,e.u,e.cat,e.a,logD(e)])])}

render();
</script></body></html>
